name: Update Latest Tag Symlink

on:
  workflow_run:
    workflows: [release]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    # Only run if the upstream cargo-dist workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move and Force-Push Latest Tag
        run: |
          # Grab the tag name directly from the completed workflow run
          TARGET_TAG="${{ github.event.workflow_run.head_branch }}"
          
          echo "Target tag to symlink: $TARGET_TAG"
          
          # Fetch the target tag commit into our local runner
          git fetch origin refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG
          
          # Force point the 'latest' tag to that specific tag's commit
          git tag -f latest $TARGET_TAG
          
          # Push the updated 'latest' tag upstream
          git push origin refs/tags/latest --force

