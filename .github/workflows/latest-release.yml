name: Update Latest Tag Symlink

on:
  workflow_run:
    workflows: [release]
    types:
      - completed

permissions:
  contents: write # Required to push git tags & mark releases as latest via gh/API

jobs:
  update-tag:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move latest tag and mark the real release as "latest"
        run: |
          TARGET_TAG="${{ github.event.workflow_run.head_branch }}"
          echo "Target tag to symlink: $TARGET_TAG"

          # Fetch target tag commit
          git fetch origin "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}"

          # Force point the 'latest' tag to that specific commit
          git tag -f latest "$TARGET_TAG"

          # Push the updated 'latest' tag upstream
          git push origin refs/tags/latest --force

          # Mark the release cargo-dist already created for $TARGET_TAG as
          # GitHub's "latest" release, instead of creating a second, empty
          # release under a "latest" tag. This is what makes
          # .../releases/latest and .../releases/latest/download/<asset>
          # resolve to this release's actual uploaded binaries.
          gh release edit "$TARGET_TAG" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
