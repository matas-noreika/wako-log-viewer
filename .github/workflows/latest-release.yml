name: Update Latest Tag Symlink

on:
  workflow_run:
    workflows: [release]
    types:
      - completed

permissions:
  contents: write # Required to push git tags & update release metadata via API

jobs:
  update-tag:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move and Force-Push Latest Tag
        run: |
          TARGET_TAG="${{ github.event.workflow_run.head_branch }}"
          echo "Target tag to symlink: $TARGET_TAG"
          
          # Fetch target tag commit
          git fetch origin refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG
          
          # Force point the 'latest' tag to that specific commit
          git tag -f latest $TARGET_TAG
          
          # Push the updated 'latest' tag upstream
          git push origin refs/tags/latest --force

      - name: Set Release UI Symlink via GitHub API
        run: |
          # Use GitHub API to explicitly force the 'latest' tag to register as the latest release metadata
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com{{ github.repository }}/releases \
            -d '{"tag_name":"latest", "name":"Latest Release", "body":"This is a rolling tag pointing to the latest stable release ($TARGET_TAG).", "make_latest":"true"}'
